name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Guarded two ways: (1) skips install/lint/typecheck/test on a Markdown-only
  # diff (see docs/docs-only-changes.md) — the job still runs and reports green,
  # it just has nothing to build; (2) guarded so CI is green on the process-only
  # baseline (no package.json yet) and self-activates once the Phase 0 scaffold
  # lands. Once package.json exists and the diff isn't docs-only, the
  # lint/typecheck/test steps run for real.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: docsonly
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$HEAD" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No comparable base commit (new branch or force-push) — running full checks."
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qvE '\.md$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Markdown-only diff — skipping install/lint/typecheck/test (docs/docs-only-changes.md)."
          fi

      - name: Detect workspace scaffold
        id: scaffold
        if: steps.docsonly.outputs.docs_only != 'true'
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — Phase 0 scaffold not merged; skipping build steps."
          fi

      - name: Set up Node
        if: steps.docsonly.outputs.docs_only != 'true' && steps.scaffold.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        if: steps.docsonly.outputs.docs_only != 'true' && steps.scaffold.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.docsonly.outputs.docs_only != 'true' && steps.scaffold.outputs.present == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.docsonly.outputs.docs_only != 'true' && steps.scaffold.outputs.present == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.docsonly.outputs.docs_only != 'true' && steps.scaffold.outputs.present == 'true'
        run: npm test
